<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="940" viewBox="0 0 1120 940" role="img" aria-labelledby="title desc">
  <title id="title">MyAvatar MVP widget design board</title>
  <desc id="desc">Exact-size closed and open widget mockups, companion picker, and state treatments.</desc>
