<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: ws://127.0.0.1:8765; img-src 'self' blob: data:; worker-src 'self' blob:;"><title>MyAvatar</title></head><body>
<div id="widget-drag" title="Drag here to move Rivet" aria-label="Drag handle"><span></span></div>
<div id="widget-tools"><div class="widget-caption"><span id="widget-name">Nova</span><span id="widget-status" aria-live="polite">Preparing…</span></div><div class="widget-toolbar">
<button id="widget-mic" aria-label="Toggle microphone" title="Start or end live conversation"></button>
<button id="widget-stop" aria-label="Stop speaking" title="Stop speaking and microphone"></button>
<button id="widget-bot" aria-label="Switch robot" title="Switch robot"></button>
<button id="widget-settings" aria-label="Open settings" title="Settings"></button>
<button id="widget-minimize" aria-label="Minimize to Dock" title="Minimize to Dock"></button>
<button id="expand" aria-label="Open controls" title="Open controls"></button>
<button id="widget-close" aria-label="Close app" title="Close app"></button>
</div></div>
<section id="bot-library" role="dialog" aria-label="Robot library" hidden><div class="library-heading"><strong>Your robots</strong><button id="library-close" aria-label="Close robot library">×</button></div><div id="bot-cards"></div></section>
<header><div><strong>MyAvatar</strong><span class="local">LOCAL COMPANION</span></div><div><select id="bot-select" aria-label="Choose robot"><option value="nova">Nova · flirty assistant</option><option value="robot">Rivet · repair robot</option><option value="butler">Sterling · wise butler</option><option value="pixel">Pixel · marketing intern</option></select><button id="collapse">◉ Widget</button><button id="close-window" aria-label="Close app">×</button><button id="transcript-toggle">Transcript</button><button id="settings-toggle">Settings</button></div></header>
<main><div id="stage"></div><aside id="transcript"><h2>Conversation</h2><div id="messages"><p class="hint">A little company, right here on your Mac.</p></div><form id="text-form"><input id="text" placeholder="Or type a message…" maxlength="2000" aria-label="Message"><button>Send</button></form><button id="clear">Clear conversation</button></aside></main>
<footer><div id="status">Connecting…</div><div class="controls"><button id="mic" disabled>Start microphone</button><button id="stop">Stop speaking</button></div><div id="detail">Turn the mic on once · pause to send · Rivet listens again after replying</div><div id="error" role="alert"></div><div id="metrics"></div><div id="fps" class="hint"></div></footer>
<dialog id="settings"><form method="dialog"><h2>Settings</h2><label>Performance<select id="performance"><option value="low">Low · MacBook Air</option><option value="medium">Medium · Better replies</option></select></label><p class="hint" id="performance-note">Low keeps memory and power use down.</p><label>Microphone mode<select id="interaction"><option value="live">Hands-free conversation</option><option value="manual">Manual · click to send</option></select></label><button id="save">Apply & restart listening</button><button value="cancel">Close</button></form></dialog>
<script type="module" src="/src/main.js"></script></body></html>
