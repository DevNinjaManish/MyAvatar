<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:8787; worker-src 'self' blob:;">
    <title>MyAvatar</title>
  </head>
  <body class="mvp-widget">
    <main id="app" aria-label="MyAvatar companion">
      <div class="stage-frame" aria-live="polite">
        <div id="stage" aria-label="Companion avatar" aria-busy="true"></div>
        <div class="presence-chip" aria-live="polite"><i></i><span id="stage-status">Warming…</span></div>
      </div>
      <section class="widget-card" aria-label="Companion controls">
        <button id="companion-toggle" class="identity" type="button" aria-expanded="false" aria-controls="companion-picker">
          <span class="identity-title"><span id="companion-name">Nova</span><small id="presence-line">Warmly attentive</small></span>
          <span class="identity-state"><i></i><span id="runtime-status" role="status">Warming…</span></span>
        </button>
        <div class="toolbar" aria-label="Primary controls">
          <button id="mic-toggle" type="button" aria-label="Start microphone"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg><span data-control-label>Mic</span></button>
          <button id="chat-toggle" type="button" aria-label="Open chat" aria-expanded="false" aria-controls="chat-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A3.5 3.5 0 0 1 8.5 2h7A3.5 3.5 0 0 1 19 5.5v6A3.5 3.5 0 0 1 15.5 15H11l-4.5 4v-4A3.5 3.5 0 0 1 5 11.5z"/><path d="M9 8.5h6M9 11.5h4"/></svg><span>Chat</span></button>
          <button id="pause-toggle" type="button" aria-label="Pause companion"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg><span data-control-label>Pause</span></button>
          <button id="more-toggle" type="button" aria-label="More options"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg><span>More</span></button>
        </div>
      </section>
      <section id="more-menu" class="more-menu" aria-label="More options" hidden>
        <header><span><small>MYAVATAR</small><strong>Preferences</strong></span><button id="more-close" type="button" aria-label="Close more menu">×</button></header>
        <section class="profile-control" aria-label="Performance profile">
          <strong>Performance</strong>
          <small id="profile-summary">Auto · detecting system RAM</small>
          <div class="profile-options" role="group" aria-label="Performance profile">
            <button id="profile-auto" type="button" aria-pressed="true">Auto</button>
            <button id="profile-fast" type="button" aria-pressed="false">Fast</button>
            <button id="profile-balanced" type="button" aria-pressed="false">Balanced</button>
          </div>
        </section>
        <section class="visual-control" aria-label="Companion appearance">
          <strong>Appearance</strong>
          <small id="appearance-summary">Natural scale · presence glow on</small>
          <div class="appearance-options" role="group" aria-label="Avatar scale">
            <button id="avatar-scale-small" type="button" aria-pressed="false">Small</button>
            <button id="avatar-scale-normal" type="button" aria-pressed="true">Natural</button>
            <button id="avatar-scale-large" type="button" aria-pressed="false">Large</button>
          </div>
          <button id="avatar-glow" class="appearance-toggle" type="button" aria-pressed="true">Presence glow</button>
          <button id="quiet-mode" class="appearance-toggle" type="button" aria-pressed="false">Quiet desktop</button>
        </section>
        <button id="runtime-health" type="button"><span>Runtime health</span><small>Provider and connection</small></button>
        <button id="hide-widget" type="button"><span>Hide widget</span><small>Keep the runtime active</small></button>
        <button id="quit-app" class="danger" type="button"><span>Quit MyAvatar</span><small>Close the app and runtime</small></button>
      </section>
      <section id="chat-panel" class="chat-panel" aria-label="Chat" hidden>
        <header><span><small id="chat-companion">NOVA</small><strong>Conversation</strong></span><span><button id="clear-chat" type="button" aria-label="Clear conversation">Clear</button><button id="chat-close" type="button" aria-label="Close chat">×</button></span></header>
        <div id="messages" class="messages"><p class="empty">What can I help with?</p></div>
        <form id="chat-form"><textarea id="message" aria-label="Message" placeholder="Message companion…" maxlength="2000"></textarea><button id="send-message" type="submit">Send</button><button id="stop-response" type="button" hidden>Stop</button></form>
      </section>
      <section id="companion-picker" class="picker" aria-label="Choose companion" hidden>
        <header><span><small>MYAVATAR</small><strong>Choose companion</strong></span><button id="picker-close" type="button" aria-label="Close companion picker">×</button></header>
        <div id="companion-options" class="picker-options"></div>
      </section>
      <p id="notice" class="notice" role="status" hidden><span id="notice-text"></span><button id="runtime-retry" type="button" hidden>Retry</button></p>
    </main>
    <script type="module" src="/src/app/entry.js"></script>
  </body>
</html>
