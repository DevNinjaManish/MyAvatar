name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Python dependencies
        run: |
          uv venv --python 3.11
          uv pip install --python .venv/bin/python -r requirements.lock
      - name: Run JavaScript tests
        run: npm run test:js
      - name: Run Python tests
        run: npm run test:py
      - name: Production build
        run: npm run build
      - name: Capture deterministic UI regression states
        run: npx electron scripts/capture-ui.cjs
      - name: Upload UI regression captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-${{ github.run_number }}
          path: artifacts/ui-regression/*.png
          if-no-files-found: error
          retention-days: 7
