name: Feature request
description: Suggest a focused improvement
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: dropdown
    id: locality
    attributes:
      label: Local-first impact
      options: [Runs entirely locally, Needs an optional external integration, Unsure]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

